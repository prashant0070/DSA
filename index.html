<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SDET Academy — interview-grade tracks for Java, Selenium, Appium, API testing, design patterns, and behavioral stories. Learn, practice, and quiz in a Scaler-style academy." />
  <title>SDET Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <link rel="stylesheet" href="web/css/app.css" />
  <style>
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: #0b1020; color: #93a0b8;
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    #boot-splash[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="boot-splash">Loading academy…</div>

  <div id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">SA</span>
        <span class="brand-text">SDET Academy</span>
      </a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-progress" id="side-progress"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search topics, questions, problems…" autocomplete="off" />
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="top-actions">
          <span class="pill" id="progress-pill">0% done</span>
        </div>
      </header>
      <div class="view" id="view"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      JavaScript is required to run SDET Academy. Enable it in your browser, then reload this page.
    </div>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script src="web/js/catalog.js"></script>
  <script src="web/js/problems.js"></script>
  <script src="web/js/progress.js"></script>
  <script src="web/js/visualizers.js"></script>
  <script src="web/js/learn.js"></script>
  <script src="web/js/practice.js"></script>
  <script src="web/js/quiz.js"></script>
  <script src="web/js/app.js"></script>
</body>
</html>
